<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erdress Games — Sitio Oficial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .game-badge {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .game-title {
            color: #f0f6fc;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background-color: #30363d;
            color: #ffffff;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #484f58;
        }
        footer a {
            color: #58a6ff;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Erdress Games</h1>
        <p>Sitio oficial de desarrollador de videojuegos indie</p>

        <div class="game-badge">
            <div class="game-title">🚀 Space Changer</div>
            <p style="margin-bottom: 0; font-size: 0.9rem;">¡Ya disponible para Android en Google Play!</p>
        </div>

        <div class="links">
            <a href="https://play.google.com/store/apps/details?id=com.erdress.space_changer" target="_blank" class="btn">Ver Space Changer en Google Play</a>
            <a href="https://www.youtube.com/@erdres8" target="_blank" class="btn btn-secondary">Canal de YouTube (Devlogs)</a>
        </div>
    </div>

    <footer>
        <p>© 2026 Erdress. Todos los derechos reservados.</p>
        <p style="margin-top: 5px;">
            <a href="politica-de-privacidad.html">Política de Privacidad</a>
        </p>
    </footer>

</body>
</html>
